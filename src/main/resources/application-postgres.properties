# --- DATASOURCE CONFIG ---
# currentSchema sets the session search_path on connect - required for any raw/dynamic
# SQL that references tables unqualified to resolve them against the "production" schema.
spring.datasource.url=jdbc:postgresql://10.100.200.131:5432/postgres?currentSchema=production
spring.datasource.username=postgres
spring.datasource.password=Chase1234@
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA DIALECT ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- DEFAULT SCHEMA ---
spring.jpa.properties.hibernate.default_schema=production

# --- Connection validation (Oracle's default "SELECT 1 FROM DUAL" doesn't exist in Postgres) ---
spring.datasource.hikari.connection-test-query=SELECT 1
